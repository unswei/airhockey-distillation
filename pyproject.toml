[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "airhockey-memory-distillation"
version = "0.1.0"
description = "Structured recurrent policy distillation for robot air hockey under tracking loss"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.0,<2",
  "numpy>=1.26,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8"]
student = ["torch>=2.7,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires the pinned upstream MuJoCo stack",
]
