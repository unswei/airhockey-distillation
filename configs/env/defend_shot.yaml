schema_version: 0
status: draft_requires_upstream_audit

task:
  id: DefendShotTrackingLoss
  control_frequency_hz: 50
  timeout_seconds: 2.5
  launch_mode: scripted_strike

observation:
  expected_dimension: 19
  include_previous_action_in_recurrence: true
  puck_position_during_blackout: [0.0, 0.0]
  include_puck_velocity: false
  include_observation_stack: false
  include_opponent_mallet: false
  measurement_noise_std: null  # Set after the upstream audit.

tracking_loss:
  episodes_have_single_contiguous_blackout: true
  minimum_visible_post_strike_steps: 5
  training_blackout_steps:
    minimum: 0
    maximum: 20
    sampling: uniform
  evaluation_blackout_steps: [0, 5, 10, 15, 20, 25]
  trigger_approach_line: null  # Set from audited table coordinates.

shot_distribution:
  # Physical ranges must be calibrated from env_info before learning starts.
  lateral_origins: null
  target_points: null
  speed_range: null
  angle_range: null
