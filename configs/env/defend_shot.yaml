schema_version: 1
status: minimal_direct_launch

task:
  id: DefendShotTrackingLoss
  control_frequency_hz: 50
  timeout_seconds: 2.5
  launch_mode: direct_launch

direct_launch:
  shot_id: near_post_right_v1
  position_table_xy: [0.55, 0.11]
  velocity_table_xy: [-1.6, 0.0]
  yaw_position: 0.0
  yaw_velocity: 0.0

observation:
  expected_dimension: 19
  include_previous_action_in_recurrence: true
  puck_position_during_blackout: [0.0, 0.0]
  include_puck_velocity: false
  include_observation_stack: false
  include_opponent_mallet: false
  measurement_noise_std: 0.0

action:
  dimension: 2
  fixed_stiffness_xy: [13.5, 13.5]
  fixed_damping_xy: [0.25, 0.25]

outcomes:
  contact_source: mujoco_puck_robot_1_ee
  return_plane_table_x: -0.55
  minimum_return_velocity_x: 0.15
  arrest_speed: 0.1
  arrest_confirmation_steps: 3
  timeout_without_contact_is_save: false
  timeout_after_contact_is_save: false

tracking_loss:
  episodes_have_single_contiguous_blackout: true
  minimum_visible_post_strike_steps: 5
  minimal_slice:
    start_observation_step: 5
    length_steps: 10
  training_blackout_steps:
    minimum: 0
    maximum: 20
    sampling: uniform
  evaluation_blackout_steps: [0, 5, 10, 15, 20, 25]
  trigger_approach_line: null  # Used after scripted strikes are implemented.

shot_distribution:
  config: direct_launch_v2.yaml
  calibration_split: calibration
  status: validated_on_marvin

reward:
  config: ../reward/defend_shot_v1.yaml
  status: validated_on_marvin
