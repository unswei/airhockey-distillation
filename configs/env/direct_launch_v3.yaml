schema_version: 1
distribution_id: direct_launch_v3
launch_mode: direct_launch
status: predeclared_unvalidated

geometry:
  table_length: 1.948
  table_width: 1.038
  goal_width: 0.25
  defending_goal_plane_x: -0.974
  defender_approach_plane_x: -0.65

sampling:
  launch_x: [0.45, 0.65]
  ballistic_approach_time_seconds: [0.36, 0.75]
  realised_approach_time_target_seconds: [0.4, 1.0]
  lateral_launch_regions:
    left: [-0.36, -0.16]
    centre: [-0.03, 0.03]
    right: [0.16, 0.36]
  goal_target_regions:
    near_post_left: [-0.095, -0.088]
    goal_centre: [-0.020, 0.020]
    near_post_right: [0.088, 0.095]
  observation_aliasing:
    # The defender is held fixed for these five visible steps. Paired shots
    # nominally rendezvous when the blackout begins, but require opposite
    # near-post defences because their velocities differ.
    blackout_start_observation_step: 5
    policy_step_seconds: 0.02
    launch_region: centre
    rendezvous_x: [0.28, 0.34]
    rendezvous_y: 0.0
    longitudinal_speed: [1.8, 2.6]
    target_regions: [near_post_left, near_post_right]

splits:
  calibration:
    seed: 1303
    alias_families: 90
    support_shots_per_launch_target_pair:
      left->near_post_left: 14
      left->goal_centre: 4
      left->near_post_right: 0
      centre->near_post_left: 0
      centre->goal_centre: 0
      centre->near_post_right: 0
      right->near_post_left: 0
      right->goal_centre: 4
      right->near_post_right: 14
    purpose: alias calibration and pre-training gate
  train:
    seed: 2303
    alias_families: 360
    support_shots_per_launch_target_pair:
      left->near_post_left: 80
      left->goal_centre: 10
      left->near_post_right: 0
      centre->near_post_left: 0
      centre->goal_centre: 0
      centre->near_post_right: 0
      right->near_post_left: 0
      right->goal_centre: 10
      right->near_post_right: 80
    purpose: teacher training after teacher-readiness gate
  validation:
    seed: 3303
    alias_families: 90
    support_shots_per_launch_target_pair:
      left->near_post_left: 20
      left->goal_centre: 2
      left->near_post_right: 0
      centre->near_post_left: 0
      centre->goal_centre: 0
      centre->near_post_right: 0
      right->near_post_left: 0
      right->goal_centre: 3
      right->near_post_right: 20
    purpose: model selection and Stage B v2 confirmation
  test:
    seed: 4303
    alias_families: 90
    support_shots_per_launch_target_pair:
      left->near_post_left: 20
      left->goal_centre: 3
      left->near_post_right: 0
      centre->near_post_left: 0
      centre->goal_centre: 0
      centre->near_post_right: 0
      right->near_post_left: 0
      right->goal_centre: 2
      right->near_post_right: 20
    purpose: final evaluation only
