schema_version: 1
status: phase_3_gru64_full_data_engineering_pilot_predeclared

purpose: >-
  Train one matched GRU-64 seed on the current frozen 40,000-episode
  deterministic aggregate. This checks the full-data GRU training path and is
  not the principal architecture comparison because half of the aggregate was
  collected under the structured k=2 behaviour policy.

pilot_scope:
  classification: engineering_pilot_not_principal_family_comparison
  allowed_claim: full_data_gru_training_and_offline_imitation_result
  disallowed_claim: fair_gru_versus_structured_behavioural_comparison
  reason: >-
    The 20,000 shadow episodes were generated by the structured k=2 student.
    A principal comparison requires a separately predeclared equal-budget
    aggregation protocol across all recurrent families.

policy:
  config: configs/student/gru_n64.yaml
  id: gru_n64
  state_dimension: 64

dataset:
  id: teacher_v3_structured_n64_k2_teacher_plus_shadow_round1_v1
  teacher_action_semantics: deterministic_actor_mean_after_public_adapter_clip
  episodes: 40000
  episode_split_modulus: 10
  train_residues: [0, 1, 2, 3, 4, 5, 6, 7]
  validation_residues: [8]
  internal_test_residues: [9]
  distribution_config: configs/env/direct_launch_v3.yaml
  distribution_split: train
  reward_config: configs/reward/defend_shot_v1.yaml
  blackout_start_observation_step: 5
  action_lock_steps: 5

training:
  seed: 14303
  sequence_length: 64
  burn_in_steps: 0
  loss_steps: 64
  maximum_episode_steps: 128
  batch_size: 128
  optimiser: adamw
  learning_rate: 0.0003
  weight_decay: 0.00001
  maximum_epochs: 100
  patience_epochs: 10
  minimum_validation_improvement: 0.000001
  gradient_clip_global_norm: 1.0
  target: deterministic_teacher_action_mean
  loss: masked_action_mean_squared_error
  selection_metric: validation_action_mse
  reset_state: episode_boundary_only
  torch_threads: 16

export:
  verification_episodes: 32
  maximum_absolute_error: 0.00002
  require_exact_checkpoint_reload: true

provenance:
  aggregate_manifest_sha256: e67438a24da12cfc1aed92f6df64253f82ce000cb52c3085d28468007ebf0d0d
  teacher_controlled_manifest_sha256: 923497e3622209c7060196ff8322f4d333626138048ad94577034c67f01c60cf
  structured_shadow_manifest_sha256: 3c85bc7f9df356bc4abd770e2251d6209388136691813b2ce27101cdddf3ac65
  structured_pilot_config: configs/student/structured_n64_k2_shadow_round1_v1.yaml
  teacher_checkpoint: frozen-teachers/dreamerv3-teacher-v3-step-700000
  teacher_selection_step: 700000
  teacher_actor_sha256: 6a672d5b6d7c2b9ca2335f1a85b69280ca7db58deb5e2f56d2ba033ebf636254
  container_digest: sha256:de846e25961d2408db73a6b5cfe2afc7ecf0e14e0e8ac837f97212a180e51d5f
