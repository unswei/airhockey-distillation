  teacher_action_semantics: deterministic_actor_mean_after_public_adapter_clip
  distribution_config: configs/env/direct_launch_v3.yaml
  distribution_split: train
  reward_config: configs/reward/defend_shot_v1.yaml
  sampling_seed: 12303
  blackout_start_observation_step: 5
  minimum_blackout_steps: 0
  maximum_blackout_steps: 20
  action_lock_steps: 5
  episodes: 16
  episodes_per_shard: 16

training:
  seed: 13303
  training_episode_count: 1
  episode_selection: first_manifest_episode
  sequence_length: 128
  burn_in_steps: 16
  batch_size: 1
  optimiser: adamw
