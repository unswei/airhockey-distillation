schema_version: 1
status: phase_3_tiny_overfit_correction_predeclared_after_v1_no_go

correction:
  parent_config: configs/student/structured_n64_k2_tiny_overfit.yaml
  parent_decision: NO_GO
  reason: >-
    Sixteen diverse episodes tested memorisation capacity rather than the
    intended single-sequence training-path sanity check. The fixed learning
    rate also produced late optimiser spikes. Use the first complete episode
    and a lower fixed rate. Preserve the v1 result unchanged.

policy:
  config: configs/student/structured_n64_k2.yaml
  id: structured_n64_k2
  state_dimension: 64
  innovation_rank: 2

dataset:
