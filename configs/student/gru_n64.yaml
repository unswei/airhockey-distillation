schema_version: 1
status: phase_3_matched_gru64_implemented_untrained

policy:
  type: gru_recurrent
  id: gru_n64
  observation_dimension: 19
  encoder:
    hidden_widths: [64, 32]
    activation: silu
    output_dimension: 32
  recurrence:
    type: gru
    state_dimension: 64
    include_previous_action: true
    previous_action_dimension: 2
  action_head:
    input: [recurrent_state, encoded_observation]
    hidden_width: 64
    activation: silu
    action_dimension: 2
    output: tanh_mean
  layer_normalisation: false
  dropout: false

training:
  target: deterministic_teacher_action_mean
  loss: action_mean_squared_error
  sequence_length: 64
  burn_in_steps: 16
  loss_steps: 48
  batch_size: 128
  optimiser: adamw
  gradient_clip_global_norm: 1.0
  reset_state: episode_boundary_only

provenance:
  teacher_checkpoint_step: 700000
  teacher_actor_sha256: 6a672d5b6d7c2b9ca2335f1a85b69280ca7db58deb5e2f56d2ba033ebf636254
