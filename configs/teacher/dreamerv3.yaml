schema_version: 1
status: corrected_procedure_ready_for_learning_check

teacher:
  type: dreamerv3
  deterministic_evaluation: true
  observation_stack: false
  privileged_state: false
  puck_velocity: false
  selection_metric: validation_save_rate_across_blackouts
  upstream_config: defaults plus size1m

training:
  distribution_config: configs/env/direct_launch_v2.yaml
  distribution_split: train
  reward_config: configs/reward/defend_shot_v1.yaml
  sampling_seed: 5201
  blackout_start_observation_step: 5
  minimum_blackout_steps: 0
  maximum_blackout_steps: 20
  reward: defend_shot_v1

smoke:
  seed: 6201
  model_preset: size1m
  steps: 1000
  batch_size: 4
  batch_length: 16
  report_length: 8
  replay_size: 10000
  train_ratio: 8.0
  save_every: 900
  checkpoint_every_steps: 500
  checkpoint_keep: 4
  purpose: collection, replay, CUDA compilation, gradient and checkpoint test

diagnostic:
  seed: 6202
  model_preset: size1m
  steps: 20000
  batch_size: 8
  batch_length: 32
  report_length: 16
  replay_size: 100000
  train_ratio: 8.0
  log_every: 1
  report_every: 3600
  save_every: 10
  purpose: short reward-bearing learning and held-out evaluation diagnostic

learning_check:
  seed: 6203
  model_preset: size1m
  steps: 20000
  batch_size: 16
  batch_length: 64
  report_length: 32
  replay_size: 200000
  replay_fractions:
    uniform: 0.2
    priority: 0.6
    recency: 0.2
  train_ratio: 80.0
  envs: 1
  log_every: 30
  report_every: 600
  save_every: 300
  checkpoint_every_steps: 20000
  checkpoint_keep: 8
  debug: true
  evaluation: evaluation
  purpose: verify the corrected upstream-like optimisation and replay procedure

full:
  seed: 7201
  model_preset: size1m
  steps: 1000000
  batch_size: 16
  batch_length: 64
  report_length: 32
  replay_size: 2000000
  replay_fractions:
    uniform: 0.2
    priority: 0.6
    recency: 0.2
  train_ratio: 80.0
  envs: 1
  log_every: 120
  report_every: 600
  save_every: 1800
  checkpoint_every_steps: 20000
  checkpoint_keep: 64
  debug: true
  evaluation: full_evaluation
  purpose: main teacher training with validation checkpoint selection

evaluation:
  distribution_config: configs/env/direct_launch_v2.yaml
  distribution_split: validation
  shot_count: 30
  blackout_steps: [0, 10, 20]

full_evaluation:
  distribution_config: configs/env/direct_launch_v2.yaml
  distribution_split: validation
  shot_count: 100
  blackout_steps: [0, 5, 10, 15, 20]

provenance:
  drl_air_hockey_commit: a41081c4c3860877d7553c7eb9e84c1b7f5f7da0
  air_hockey_challenge_commit: 34729081d4327141dcf560c0fb8274cd4882e82c
  dreamerv3_repository: https://github.com/AndrejOrsula/dreamerv3
